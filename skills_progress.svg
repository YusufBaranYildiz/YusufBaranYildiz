<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="AI and Engineering Proficiency Metrics Dashboard">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1D28"/>
      <stop offset="100%" stop-color="#08131C"/>
    </linearGradient>

    <!-- Progress Bar Gradient 1 (Cyan to Blue) -->
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- Progress Bar Gradient 2 (Pink to Purple) -->
    <linearGradient id="barPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <!-- Progress Bar Gradient 3 (Emerald/Teal) -->
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>

    <!-- Shimmer Highlight Effect -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panelClip">
      <rect width="1000" height="280" rx="16"/>
    </clipPath>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
      
      /* Bar Fill Animations */
      .fill-95 { width: 0; animation: fillAnim95 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim95 { to { width: 665px; } }

      .fill-94 { width: 0; animation: fillAnim94 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim94 { to { width: 658px; } }

      .fill-92 { width: 0; animation: fillAnim92 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim92 { to { width: 644px; } }

      .fill-88 { width: 0; animation: fillAnim88 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim88 { to { width: 616px; } }

      .fill-86 { width: 0; animation: fillAnim86 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim86 { to { width: 602px; } }

      .fill-82 { width: 0; animation: fillAnim82 2.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; }
      @keyframes fillAnim82 { to { width: 574px; } }

      /* Shimmer sweep animation */
      .shimmer-slide {
        animation: shimmerMove 3.5s ease-in-out infinite;
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(800px); }
      }

      /* Pulsing Dot */
      .pulse-beacon {
        animation: beaconGlow 1.8s ease-in-out infinite;
      }
      @keyframes beaconGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00D9FF); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>

  <!-- Panel Body -->
  <g clip-path="url(#panelClip)">
    <rect width="1000" height="280" fill="url(#cardBg)"/>

    <!-- Subtle Grid Overlay -->
    <path d="M 0 45 L 1000 45" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Header Terminal HUD -->
    <g transform="translate(35, 28)">
      <circle cx="0" cy="0" r="4.5" fill="#00D9FF" class="pulse-beacon"/>
      <text class="mono" x="14" y="4" font-size="13" font-weight="700" fill="#00D9FF" letter-spacing="1.5">
        SYSTEM DIAGNOSTICS // AI &amp; MODEL ARCHITECTURE METRICS
      </text>
      <!-- Right Status Badge -->
      <rect x="800" y="-12" width="130" height="22" rx="11" fill="#06313D" stroke="#00D9FF" stroke-width="1"/>
      <text class="mono" x="865" y="3" font-size="10" font-weight="700" fill="#7CECFF" text-anchor="middle" letter-spacing="1">
        ● LIVE BENCHMARK
      </text>
    </g>

    <!-- ==================== SKILL METRIC 1: Python & AI Frameworks ==================== -->
    <g transform="translate(35, 68)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">🐍 Python Core &amp; Frameworks (PyTorch, TensorFlow, Keras)</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#00D9FF" text-anchor="end">95%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-95" x="0" y="8" height="9" rx="4.5" fill="url(#barCyan)" filter="url(#hudGlow)"/>
    </g>

    <!-- ==================== SKILL METRIC 2: Deep Learning & Neural Architectures ==================== -->
    <g transform="translate(35, 104)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">🧠 Deep Learning &amp; Neural Nets (CNN, RNN, Transformers, Latent Spaces)</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#FF6B9D" text-anchor="end">94%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-94" x="0" y="8" height="9" rx="4.5" fill="url(#barPink)" filter="url(#hudGlow)"/>
    </g>

    <!-- ==================== SKILL METRIC 3: Machine Learning & Predictive Modeling ==================== -->
    <g transform="translate(35, 140)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">📊 Machine Learning &amp; Predictive Analytics (Scikit-Learn, Feature Eng.)</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#00D9FF" text-anchor="end">92%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-92" x="0" y="8" height="9" rx="4.5" fill="url(#barCyan)" filter="url(#hudGlow)"/>
    </g>

    <!-- ==================== SKILL METRIC 4: Computer Vision & Style Transfer ==================== -->
    <g transform="translate(35, 176)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">👁️ Computer Vision &amp; Style Transfer (OpenCV, Image Processing)</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">88%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-88" x="0" y="8" height="9" rx="4.5" fill="url(#barTeal)" filter="url(#hudGlow)"/>
    </g>

    <!-- ==================== SKILL METRIC 5: AI Agents & Automation ==================== -->
    <g transform="translate(35, 212)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">🤖 Autonomous AI Agents &amp; Workflow Automation</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#FF6B9D" text-anchor="end">86%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-86" x="0" y="8" height="9" rx="4.5" fill="url(#barPink)" filter="url(#hudGlow)"/>
    </g>

    <!-- ==================== SKILL METRIC 6: Full Stack & Engineering ==================== -->
    <g transform="translate(35, 248)">
      <text class="mono" x="0" y="0" font-size="13" font-weight="500" fill="#E2F2FC">🌐 Full Stack Software Architecture (React, TypeScript, C++, Git)</text>
      <text class="mono" x="930" y="0" font-size="13" font-weight="700" fill="#00D9FF" text-anchor="end">82%</text>
      <!-- Track -->
      <rect x="0" y="8" width="930" height="9" rx="4.5" fill="#081822" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- Bar Fill -->
      <rect class="fill-82" x="0" y="8" height="9" rx="4.5" fill="url(#barCyan)" filter="url(#hudGlow)"/>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#00D9FF" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
