<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 126" width="1000" height="126" role="img" aria-label="Animated Tech Stack: AI &amp; Machine Learning and Software Engineering Tools">
  <defs>
    <!-- Left & Right Smooth Fade Mask -->
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="6%" stop-color="#FFFFFF"/>
      <stop offset="94%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect width="1000" height="126" fill="url(#fadeGrad)"/>
    </mask>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=swap');
      .badge-text {
        font-family: 'JetBrains Mono', 'Segoe UI', -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #F0F6FC;
      }

      /* Row 1: Leftward Infinite Scroll (AI/ML) */
      .scroll-row-1 {
        animation: scrollLeft 36s linear infinite;
      }
      @keyframes scrollLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-1680px); }
      }

      /* Row 2: Rightward Infinite Scroll (Dev/Tools) */
      .scroll-row-2 {
        animation: scrollRight 38s linear infinite;
      }
      @keyframes scrollRight {
        0% { transform: translateX(-1680px); }
        100% { transform: translateX(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>

  <g mask="url(#edgeFade)">
