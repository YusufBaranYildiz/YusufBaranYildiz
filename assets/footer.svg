.st{animation:st 2.6s ease-in-out infinite}
@keyframes st{0%,100%{opacity:.15}50%{opacity:.9}}
.hb{animation:hb 3s ease-in-out infinite}
@keyframes hb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}]]></style>
