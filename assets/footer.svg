<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="Happy Coding">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C5364"/><stop offset=".5" stop-color="#00D9FF"/><stop offset="1" stop-color="#FF6B9D"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B9D"/><stop offset=".5" stop-color="#00D9FF"/><stop offset="1" stop-color="#2C5364"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C5364"/><stop offset=".5" stop-color="#1B3A47"/><stop offset="1" stop-color="#2C5364"/></linearGradient>
<style><![CDATA[
.sf{font-family:'Segoe UI','Helvetica Neue',Arial,'Noto Sans',sans-serif}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.f1{animation:f1 12s linear infinite}
@keyframes f1{to{transform:translateX(-500px)}}
.f2{animation:f2 9s linear infinite}
@keyframes f2{from{transform:translateX(-400px)}to{transform:translateX(0)}}
.f3{animation:f3 7s linear infinite}
