<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Yusuf Baran Yıldız — Yazılım Mühendisi · AI &amp; Machine Learning</title>
  <desc id="descId">Animated Cyberpunk Header for Yusuf Baran Yıldız - AI &amp; Deep Learning Engineer</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E14"/>
      <stop offset="45%" stop-color="#0A1822"/>
      <stop offset="80%" stop-color="#102B3A"/>
      <stop offset="100%" stop-color="#1B3A4B"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2F9FF"/>
      <stop offset="75%" stop-color="#7CE8FF"/>
      <stop offset="100%" stop-color="#FF85B3"/>
    </linearGradient>

    <linearGradient id="waveG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2C5364" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FF6B9D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#102B3A" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Laser & Border Gradients -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="35%" stop-color="#00D9FF"/>
      <stop offset="70%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#00D9FF" fill-opacity="0.12"/>
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="0.8"/>
    </pattern>

    <!-- Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="deepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="cardClip">
      <rect width="1000" height="320" rx="20"/>
    </clipPath>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
      
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', Consolas, 'Fira Code', monospace; }

      /* Scanning Radar Beam */
      .scanner {
        animation: scanAnim 7s ease-in-out infinite alternate;
      }
      @keyframes scanAnim {
        0% { transform: translateY(0); opacity: 0.1; }
        50% { opacity: 0.5; }
        100% { transform: translateY(320px); opacity: 0.15; }
      }

      /* Glowing Pulsing Header Text */
      .title-pulse {
        animation: titleGlow 4s ease-in-out infinite;
      }
      @keyframes titleGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(0,217,255,0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 22px rgba(0,217,255,0.85)); }
      }

      /* Running Neon Border */
      .border-runner {
        stroke-dasharray: 220 2200;
        animation: runBorder 8s linear infinite;
      }
      @keyframes runBorder {
        to { stroke-dashoffset: -2420; }
      }

      /* Parallax Waves */
      .wave1 { animation: waveMove1 12s linear infinite; }
      @keyframes waveMove1 { to { transform: translateX(-500px); } }
      .wave2 { animation: waveMove2 9s linear infinite; }
      @keyframes waveMove2 { from { transform: translateX(-400px); } to { transform: translateX(0); } }
      .wave3 { animation: waveMove3 7s linear infinite; }
      @keyframes waveMove3 { to { transform: translateX(-350px); } }

      /* Live System Indicator */
      .live-dot {
        animation: livePulse 1.8s ease-in-out infinite;
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      /* Floating Math/AI Particles */
      .ai-particle {
        opacity: 0;
        animation: floatUp 11s linear infinite;
      }
      @keyframes floatUp {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.45; }
        85% { opacity: 0.35; }
        100% { transform: translateY(-130px); opacity: 0; }
      }

      /* Neural network dashed line stream */
      .synapse-flow {
        stroke: #00D9FF;
        stroke-opacity: 0.45;
        stroke-width: 1.2;
        stroke-dasharray: 3 8;
        animation: synapseStream 2s linear infinite;
      }
      @keyframes synapseStream {
        to { stroke-dashoffset: -22; }
      }

      /* Floating Node Glow */
      .node-twinkle {
        animation: nodeTw 3.2s ease-in-out infinite alternate;
      }
      @keyframes nodeTw {
        0% { opacity: 0.4; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.15); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>

  <!-- Main Card Body -->
  <g clip-path="url(#cardClip)">
    <!-- Deep Gradient Background -->
    <rect width="1000" height="320" fill="url(#bg)"/>
    
    <!-- Cyberpunk Grid Overlay -->
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- Ambient Glowing Nebulas -->
    <circle cx="830" cy="90" r="240" fill="url(#glowCyan)"/>
    <circle cx="140" cy="280" r="270" fill="url(#glowPink)"/>
    <circle cx="500" cy="160" r="300" fill="url(#glowCenter)"/>

    <!-- Scanning Radar Beam Line -->
    <g class="scanner">
      <rect x="0" y="0" width="1000" height="3" fill="url(#scanGrad)"/>
    </g>

    <!-- HUD Corner Brackets -->
    <g stroke="#00D9FF" stroke-opacity="0.5" stroke-width="1.8" fill="none">
      <path d="M 18 36 L 18 18 L 36 18"/>
      <path d="M 982 36 L 982 18 L 964 18"/>
      <path d="M 18 284 L 18 302 L 36 302"/>
      <path d="M 982 284 L 982 302 L 964 302"/>
    </g>

    <!-- Top Status HUD Bar -->
    <g transform="translate(45, 34)">
      <!-- System status pill -->
      <rect width="210" height="24" rx="12" fill="#0C202C" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.4"/>
      <circle class="live-dot" cx="14" cy="12" r="4.5" fill="#10B981" filter="url(#neonGlow)"/>
      <text class="font-mono" x="26" y="16" font-size="11" font-weight="600" fill="#7EE787" letter-spacing="1">SYSTEM: ONLINE · AI CORE</text>

      <!-- Right HUD Tags -->
      <text class="font-mono" x="895" y="16" font-size="11" fill="#75A4B8" text-anchor="end" letter-spacing="1.5">// RESEARCHER · ML/DL v2026</text>
    </g>

    <!-- ==================== NEURAL NETWORK ANIMATION (Right Side) ==================== -->
    <!-- Synaptic Background Static Lines -->
    <g stroke="#00D9FF" stroke-opacity="0.12" stroke-width="1">
      <!-- Input to H1 -->
      <line x1="720" y1="100" x2="800" y2="70"/><line x1="720" y1="100" x2="800" y2="115"/><line x1="720" y1="100" x2="800" y2="160"/><line x1="720" y1="100" x2="800" y2="205"/><line x1="720" y1="100" x2="800" y2="250"/>
      <line x1="720" y1="160" x2="800" y2="70"/><line x1="720" y1="160" x2="800" y2="115"/><line x1="720" y1="160" x2="800" y2="160"/><line x1="720" y1="160" x2="800" y2="205"/><line x1="720" y1="160" x2="800" y2="250"/>
      <line x1="720" y1="220" x2="800" y2="70"/><line x1="720" y1="220" x2="800" y2="115"/><line x1="720" y1="220" x2="800" y2="160"/><line x1="720" y1="220" x2="800" y2="205"/><line x1="720" y1="220" x2="800" y2="250"/>
      <!-- H1 to H2 -->
      <line x1="800" y1="70" x2="880" y2="70"/><line x1="800" y1="70" x2="880" y2="115"/><line x1="800" y1="70" x2="880" y2="160"/><line x1="800" y1="70" x2="880" y2="205"/><line x1="800" y1="70" x2="880" y2="250"/>
      <line x1="800" y1="115" x2="880" y2="70"/><line x1="800" y1="115" x2="880" y2="115"/><line x1="800" y1="115" x2="880" y2="160"/><line x1="800" y1="115" x2="880" y2="205"/><line x1="800" y1="115" x2="880" y2="250"/>
      <line x1="800" y1="160" x2="880" y2="70"/><line x1="800" y1="160" x2="880" y2="115"/><line x1="800" y1="160" x2="880" y2="160"/><line x1="800" y1="160" x2="880" y2="205"/><line x1="800" y1="160" x2="880" y2="250"/>
      <line x1="800" y1="205" x2="880" y2="70"/><line x1="800" y1="205" x2="880" y2="115"/><line x1="800" y1="205" x2="880" y2="160"/><line x1="800" y1="205" x2="880" y2="205"/><line x1="800" y1="205" x2="880" y2="250"/>
      <line x1="800" y1="250" x2="880" y2="70"/><line x1="800" y1="250" x2="880" y2="115"/><line x1="800" y1="250" x2="880" y2="160"/><line x1="800" y1="250" x2="880" y2="205"/><line x1="800" y1="250" x2="880" y2="250"/>
      <!-- H2 to Output -->
      <line x1="880" y1="70" x2="955" y2="110"/><line x1="880" y1="70" x2="955" y2="160"/><line x1="880" y1="70" x2="955" y2="210"/>
      <line x1="880" y1="115" x2="955" y2="110"/><line x1="880" y1="115" x2="955" y2="160"/><line x1="880" y1="115" x2="955" y2="210"/>
      <line x1="880" y1="160" x2="955" y2="110"/><line x1="880" y1="160" x2="955" y2="160"/><line x1="880" y1="160" x2="955" y2="210"/>
      <line x1="880" y1="205" x2="955" y2="110"/><line x1="880" y1="205" x2="955" y2="160"/><line x1="880" y1="205" x2="955" y2="210"/>
      <line x1="880" y1="250" x2="955" y2="110"/><line x1="880" y1="250" x2="955" y2="160"/><line x1="880" y1="250" x2="955" y2="210"/>
    </g>

    <!-- Active Dashed Synapse Flows -->
    <g class="synapse-flow">
      <line x1="720" y1="100" x2="800" y2="160"/>
      <line x1="720" y1="160" x2="800" y2="70"/>
      <line x1="720" y1="220" x2="800" y2="205"/>
      <line x1="800" y1="70" x2="880" y2="115"/>
      <line x1="800" y1="160" x2="880" y2="160"/>
      <line x1="800" y1="205" x2="880" y2="70"/>
      <line x1="880" y1="115" x2="955" y2="110"/>
      <line x1="880" y1="160" x2="955" y2="160"/>
      <line x1="880" y1="205" x2="955" y2="210"/>
    </g>

    <!-- Radar Expanding Rings on Selected Nodes -->
    <circle cx="720" cy="160" r="6" fill="none" stroke="#00D9FF" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="6;24" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="70" r="6" fill="none" stroke="#FF6B9D" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="6;24" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="160" r="6" fill="none" stroke="#00D9FF" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="6;24" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="955" cy="160" r="6" fill="none" stroke="#FF6B9D" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="6;24" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Synaptic Signal Packets (Traveling photons) -->
    <circle r="3.5" cx="0" cy="0" fill="#00D9FF" filter="url(#neonGlow)" opacity="0">
      <animateMotion dur="2.6s" begin="0.2s" repeatCount="indefinite" path="M720,100 L800,160 L880,115 L955,110"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cx="0" cy="0" fill="#FF6B9D" filter="url(#neonGlow)" opacity="0">
      <animateMotion dur="3.1s" begin="0.9s" repeatCount="indefinite" path="M720,160 L800,70 L880,160 L955,160"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cx="0" cy="0" fill="#FFFFFF" filter="url(#neonGlow)" opacity="0">
      <animateMotion dur="2.8s" begin="1.6s" repeatCount="indefinite" path="M720,220 L800,205 L880,250 L955,210"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cx="0" cy="0" fill="#00F0FF" filter="url(#neonGlow)" opacity="0">
      <animateMotion dur="3.4s" begin="2.3s" repeatCount="indefinite" path="M720,160 L800,250 L880,70 L955,110"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.4s" begin="2.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Neural Nodes -->
    <!-- Input Layer -->
    <circle class="node-twinkle" cx="720" cy="100" r="5.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="720" cy="160" r="6.5" fill="#FF6B9D"/>
    <circle class="node-twinkle" cx="720" cy="220" r="5.5" fill="#00D9FF"/>

    <!-- Hidden Layer 1 -->
    <circle class="node-twinkle" cx="800" cy="70" r="5.5" fill="#FF6B9D"/>
    <circle class="node-twinkle" cx="800" cy="115" r="5.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="800" cy="160" r="6.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="800" cy="205" r="5.5" fill="#FF6B9D"/>
    <circle class="node-twinkle" cx="800" cy="250" r="5.5" fill="#00D9FF"/>

    <!-- Hidden Layer 2 -->
    <circle class="node-twinkle" cx="880" cy="70" r="5.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="880" cy="115" r="6" fill="#FF6B9D"/>
    <circle class="node-twinkle" cx="880" cy="160" r="6.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="880" cy="205" r="5.5" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="880" cy="250" r="5.5" fill="#FF6B9D"/>

    <!-- Output Layer -->
    <circle class="node-twinkle" cx="955" cy="110" r="6" fill="#00D9FF"/>
    <circle class="node-twinkle" cx="955" cy="160" r="7" fill="#FF6B9D"/>
    <circle class="node-twinkle" cx="955" cy="210" r="6" fill="#00D9FF"/>

    <!-- Floating Math & Code Particles -->
    <text class="font-mono ai-particle" x="110" y="220" font-size="18" fill="#FF6B9D" style="animation-duration:11s;animation-delay:-1s">∇W·x + b</text>
    <text class="font-mono ai-particle" x="250" y="240" font-size="20" fill="#00D9FF" style="animation-duration:13s;animation-delay:-3s">Loss: 0.0142</text>
    <text class="font-mono ai-particle" x="380" y="230" font-size="18" fill="#FF6B9D" style="animation-duration:10s;animation-delay:-5s">σ(z) = 1/(1+e⁻ᶻ)</text>
    <text class="font-mono ai-particle" x="520" y="250" font-size="19" fill="#00D9FF" style="animation-duration:14s;animation-delay:-7s">Epoch: 100/100</text>
    <text class="font-mono ai-particle" x="650" y="220" font-size="16" fill="#FF6B9D" style="animation-duration:12s;animation-delay:-2s">{ AI_Agents }</text>

    <!-- Parallax Sinusoidal Waves at Bottom -->
    <g class="wave1">
      <path d="M0,270 Q125,258 250,270 T500,270 T750,270 T1000,270 T1250,270 T1500,270 T1750,270 T2000,270 L2000,320 L0,320 Z" fill="url(#waveG1)"/>
    </g>
    <g class="wave2">
      <path d="M0,282 Q100,268 200,282 T400,282 T600,282 T800,282 T1000,282 T1200,282 T1400,282 T1600,282 T1800,282 L1800,320 L0,320 Z" fill="url(#waveG2)"/>
    </g>
    <g class="wave3">
      <path d="M0,294 Q80,284 160,294 T320,294 T480,294 T640,294 T800,294 T960,294 T1120,294 T1280,294 T1440,294 L1440,320 L0,320 Z" fill="#0A1E2B" fill-opacity="0.85"/>
    </g>

    <!-- ==================== MAIN HERO TYPOGRAPHY ==================== -->
    <!-- Prompt prefix -->
    <text class="font-mono" x="48" y="96" font-size="17" font-weight="600" fill="#FF6B9D">// MERHABA, BEN</text>
    <!-- Cursor blink next to prefix -->
    <rect x="185" y="81" width="9" height="18" fill="#FF6B9D">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Glow background layer for Name -->
    <text class="font-sans title-pulse" x="45" y="162" font-size="62" font-weight="800" fill="#00D9FF" filter="url(#deepBlur)" textLength="600" lengthAdjust="spacingAndGlyphs">
      Yusuf Baran Yıldız
    </text>
    <!-- Crisp Foreground Name -->
    <text class="font-sans" x="45" y="162" font-size="62" font-weight="800" fill="url(#nameG)" textLength="600" lengthAdjust="spacingAndGlyphs">
      Yusuf Baran Yıldız
    </text>

    <!-- Subtitle Role -->
    <text class="font-sans" x="48" y="206" font-size="24" font-weight="700" fill="#00D9FF" textLength="540" lengthAdjust="spacingAndGlyphs">
      Yazılım Mühendisi · AI &amp; Deep Learning Developer
    </text>

    <!-- Skill Tags Badges (Pills) -->
    <g transform="translate(48, 226)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#0B2330" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.6"/>
      <text class="font-mono" x="64" y="17" font-size="11" font-weight="600" fill="#D9F6FF" text-anchor="middle">🧠 Deep Learning</text>

      <!-- Pill 2 -->
      <rect x="136" y="0" width="138" height="26" rx="6" fill="#0B2330" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.6"/>
      <text class="font-mono" x="205" y="17" font-size="11" font-weight="600" fill="#FFE2EC" text-anchor="middle">👁️ Computer Vision</text>

      <!-- Pill 3 -->
      <rect x="282" y="0" width="112" height="26" rx="6" fill="#0B2330" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.6"/>
      <text class="font-mono" x="338" y="17" font-size="11" font-weight="600" fill="#D9F6FF" text-anchor="middle">🤖 AI Agents</text>

      <!-- Pill 4 -->
      <rect x="402" y="0" width="132" height="26" rx="6" fill="#0B2330" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.6"/>
      <text class="font-mono" x="468" y="17" font-size="11" font-weight="600" fill="#FFE2EC" text-anchor="middle">⚡ Predictive ML</text>
    </g>
  </g>

  <!-- Glowing Static Outer Border -->
  <rect x="1" y="1" width="998" height="318" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Running Neon Beam Border -->
  <rect class="border-runner" x="1" y="1" width="998" height="318" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#neonGlow)"/>
</svg>